name: DIGI PACK ERP CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CLOUDFLARE_PROJECT_NAME: digipack

jobs:
  build-and-deploy:
    name: Build and Deploy DIGI PACK ERP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Bun Runtime
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Step 3: Environment Diagnostics
      - name: Environment Diagnostics
        run: |
          echo "=== Runner Environment ==="
          bun --version
          pwd
          ls -la

      # Step 4: Install Dependencies (Frozen lockfile via bun.lock)
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Step 5: Verify Installed Dependencies
      - name: Dependency Verification
        run: bun pm ls

      # Step 6: TypeScript & Lint Verification
      - name: TypeScript & Lint Verification
        run: bun run lint

      # Step 7: Production Build (Vite -> dist)
      - name: Production Build
        run: bun run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}

      # Step 8: Verify Build Artifacts & SPA Routing
      - name: Verify Build Artifacts
        run: |
          echo "=== Verifying Build Directory ==="
          if [ ! -d "dist" ]; then
            echo "ERROR: Build output directory 'dist' was not found!"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: 'dist/index.html' is missing!"
            exit 1
          fi

          if [ ! -f "dist/_redirects" ]; then
            echo "ERROR: 'dist/_redirects' is missing (required for Cloudflare Pages SPA routing)!"
            exit 1
          fi

          echo "SUCCESS: Build directory verified with index.html, _redirects, _headers, and assets:"
          ls -la dist

      # Step 9: Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=digipack
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Step 10: Informational notice when Cloudflare secrets are pending
      - name: Cloudflare Deployment Status
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice ::Build, TypeScript validation, and asset verification completed successfully! To enable automatic edge deployment to Cloudflare Pages on push, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in your GitHub Repository > Settings > Secrets and variables > Actions."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
