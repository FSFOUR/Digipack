name: DIGI PACK ERP CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CLOUDFLARE_PROJECT_NAME: digipack

jobs:
  build-and-deploy:
    name: Build and Deploy DIGI PACK ERP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Pinned Bun Runtime (v1.2.4)
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.4

      # Step 3: Safe Environment Diagnostics
      - name: Environment Diagnostics
        run: |
          echo "=== Runner Environment ==="
          bun --version
          pwd

      # Step 4: Install Dependencies via Frozen Lockfile
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Step 5: TypeScript Compilation Check
      - name: TypeScript Verification
        run: bun run typecheck

      # Step 6: Code Quality & Lint
      - name: Lint Verification
        run: bun run lint

      # Step 7: Production Vite Build
      - name: Production Vite Build
        run: bun run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}

      # Step 8: Verify Production Build Artifacts & SPA Routing
      - name: Verify Build Artifacts
        run: |
          echo "=== Verifying Build Artifacts in dist/ ==="
          if [ ! -d "dist" ]; then
            echo "ERROR: Build directory 'dist' was not found!"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: 'dist/index.html' is missing!"
            exit 1
          fi

          if [ ! -d "dist/assets" ]; then
            echo "ERROR: 'dist/assets' directory is missing!"
            exit 1
          fi

          if [ ! -f "dist/_redirects" ]; then
            echo "ERROR: 'dist/_redirects' is missing for Cloudflare Pages SPA routing!"
            exit 1
          fi

          echo "SUCCESS: Production build artifacts verified:"
          ls -la dist

      # Step 9: Deploy to Cloudflare Pages (When API Token is provided)
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          command: pages deploy dist --project-name=digipack
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Step 10: Informational Notice (When Cloudflare Secrets are pending in GitHub)
      - name: Cloudflare Deployment Status
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice ::CI build, TypeScript check, and asset verification succeeded with 0 errors! To activate automatic edge deployment to Cloudflare Pages on push, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under GitHub Repository > Settings > Secrets and variables > Actions."
