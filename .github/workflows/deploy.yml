name: build-and-deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'digipack' }}

jobs:
  build-and-deploy:
    name: Build and Deploy DIGI PACK ERP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 22 LTS
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Safe Environment Diagnostics (No secrets printed)
      - name: Environment Diagnostics
        run: |
          echo "=== Runner Environment ==="
          node --version
          npm --version
          pwd
          ls -la

      # Step 3: Install Dependencies (npm ci using frozen package-lock.json)
      - name: Install Dependencies
        run: |
          echo "=== Installing Dependencies via npm ci ==="
          npm ci
          echo "=== Top-level Installed Packages ==="
          npm list --depth=0

      # Step 4: Lint & TypeScript Verification
      - name: Lint Code
        run: npm run lint

      # Step 5: Build Application (Vite -> dist)
      - name: Build Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}

      # Step 6: Verify Build Output & SPA Configs
      - name: Verify Build Artifacts
        run: |
          echo "=== Verifying Build Directory ==="
          if [ ! -d "dist" ]; then
            echo "ERROR: Build output directory 'dist' was not found!"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: 'dist/index.html' is missing!"
            exit 1
          fi

          if [ ! -f "dist/_redirects" ]; then
            echo "ERROR: 'dist/_redirects' is missing (required for Cloudflare Pages SPA routing)!"
            exit 1
          fi

          echo "SUCCESS: Build directory verified with index.html, _redirects, and assets:"
          ls -la dist

      # Step 7: Informational step if Cloudflare Token is not set
      - name: Cloudflare Configuration Notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice ::CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets. The build and validation completed with 0 errors! To enable automatic deployment to Cloudflare Pages on every push, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to your GitHub Repository > Settings > Secrets and variables > Actions."

      # Step 8: Deploy to Cloudflare Pages (When credentials exist)
      - name: Deploy to Cloudflare Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
